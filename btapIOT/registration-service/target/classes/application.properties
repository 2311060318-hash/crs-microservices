spring.application.name=registration-service
server.port=8083

# H2 in-memory database (khong can DB rieng, chay tren RAM)
spring.datasource.url=jdbc:h2:mem:registration_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console (co the xem qua browser tai http://localhost:8083/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# URL cua course-service (chay tren port 8082)
course.service.base-url=http://localhost:8081
